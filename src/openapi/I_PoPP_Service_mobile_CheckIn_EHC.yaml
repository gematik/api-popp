openapi: 3.2.0
info:
  title: OpenAPI description for PoPP-Modul - mobile Check-In with eHealth-Card.
  version: 1.0.0
  description: |
    This interface describes the message exchange between the PoPP-Module 
    and the PoPP-Service if an insured person uses an eHC (eGK) for
    authentication.
    Upon success the PoPP-Service stores a PoPP data record.

paths:
  /popp/mobile/api/checkin/ehc/v1:
    summary: WebSocket endpoint for mobile Check-in with eHC (eGK).
    description: |
      This endpoint allows the client to establish a WebSocket connection to the
      server and transmit messages to mobil Check-in token using an eHC.
    get:
      summary: |
        Establish WebSocket Connection.
         
        Note: The actual connection is established using the WebSocket protocol 
        (wss://) and not via regular HTTP GET.
      operationId: connect
      responses:
        '101':
          description: Switching protocols to WebSocket
        '400':
          description: Bad request - unable to establish connection
        '404':
          description: Not found - requested service is not available
        '426':
          description: Upgrade Required - invalid Sec-WebSocket-Version
      security:
        - oauth2Profiles: [ "checkin:ehc" ]


components:
  schemas:
    StartMessage:
      type: object
      title: "Start proof process using electronic health card (eHC)"
      description: Sent by a client to start the eHC proof process.
      properties:
        type:
          type: string
          const: "Start"
          description: "The constant type identifier for Start."
        version:
          type: string
          const: "1.0.0"
          description: |
            The version of the eHC proof process to use, chosen by the client. 
            Server is expected to support this version.
            - version="1.0.0": actual value of "version"
        cardConnectionType:
          type: string
          enum:
            - "contactless-standard"
          description: |
            The type of smartcard connection the client claims to use:
            
            * "contactless-standard": contactless smartcard communication using
            a protocol from ISO/IEC 14443 series
        clientSessionId:
          type: string
          description: |
            A unique identifier for the client session.
            This value is generated by a client.  
            A 128-bit octet string identifying a clients's session consisting of
            one or more "StandardScenarioMessage". It is recommended to use
            UUID according to RFC 4122.
            The PoPP-Service will use this value as
            "StandardScenarioMessage.clientSessionId".
      examples:
        - type: "Start"
          version: "1.0.0"
          cardConnectionType: "contact-standard"
          clientSessionId: "123e4567-e89b-12d3-a456-426614174000"
      required:
        - type
        - version
        - cardConnectionType
        - clientSessionId
    # afi, Frage: In der Besprechung am 14. August hatte ich verstanden, dass
    #             die StartMessage auch die Telematik-ID und (optional) eine
    #             Workplace ID enthält. Warum fehlen die hier?

    StandardScenarioMessage:
      type: object
      title: "Bunch of commands to be executed by an eHC"
      description: |
        Sent by the server to the client to execute zero, one or more 
        command APDUs by an electronic Health-Card (eHC).
      properties:
        type:
          type: string
          const: "StandardScenario"
          description: "The constant type identifier for StandardScenario."
        version:
          type: string
          const: "1.0.0"
          description: |
            Version of the scenario message.
            - version = "1.0.0": actual value of "version".
        clientSessionId:
          type: string
          description: |
            Session identifier for the scenario message.
            The value is taken from "StartMessage.clientSessionId".
        sequenceCounter:
          type: integer
          minimum: 0
          maximum: 32767
          description: |
            An integer preventing replay attacks.
            The first "StandardScenarioMessage" has "sequenceCounter=0".
            In the next "StandardScenarioMessage" the "sequenceCounter" is
            incremented by one.
        timeSpan:
          type: integer
          minimum: 0
          maximum: 32767
          format: duration
          description: |
            An integer indicating the time span in
            milliseconds for the PoPP-Service between receiving a
            "ScenarioResponseMessage" till the (expected) send time of the next
            "StandardScenarioMessage".
            A client may use this information to detect a timeout.
            The special value "timeSpan=0" indicates that this is the last
            "StandardScenarioMessage" in a sequence.
        steps:
          type: array
          description: List of steps in the scenario.
          items:
            $ref: "#/components/schemas/ScenarioStep"
          minItems: 0
          maxItems: 63
      required:
        - type
        - version
        - clientSessionId
        - sequenceCounter
        - timeSpan
        - steps

    ScenarioStep:
      type: object
      title: "Single command to be executed by an eHC"
      description: |
        Encapsulates a single command APDU to be executed by an electronic
        Health-Card (eHC) including the expected status words.
      properties:
        commandApdu:
          type: string
          description: ISO/IEC 7816-4 command APDU as hexadecimal string.
        expectedStatusWords:
          type: array
          description: |
            List of expected status words in the corresponding response APDU
            as hexadecimal strings.
          items:
            type: string
      examples:
        - commandApdu: "00a4040c"
          expectedStatusWords: ["9000", "6f00"]
      required:
        - commandApdu
        - expectedStatusWords

    ScenarioResponseMessage:
      type: object
      title: "Bunch of response APDU received from an eHC"
      description: |
        Sent by a client to the server after the client received a
        StandardScenarioMessage.
      properties:
        type:
          type: string
          const: "ScenarioResponse"
          description: "The constant type identifier for ScenarioResponse."
        steps:
          type: array
          description: |
            List of ISO/IEC 7816-4 response APDU as hexadecimal strings.
            The responses from the smartcard.
            The 1st element corresponds to the 1st command APDU from a Scenario.
            The n-th element corresponds to the n-th command APDU from a Scenario.
            The array is empty if and only if a Scenario does not contain any
            command APDU.
          items:
            type: string
            description: |
              Response from the smartcard encoded in hexadecimal characters
              [0-9a-f]. Contains at least 4 characters (status word).
      examples:
        - type: "ScenarioResponse"
          steps: ["9000", "abcd9000", "11223344559000", "6a81"]
      required:
        - type
        - steps

    ErrorMessage:
      type: object
      title: "Error"
      description: Sent by the server to indicate an error.
      properties:
        type:
          type: string
          const: "Error"
          description: "The constant type identifier for Error."
        errorCode:
          type: string
          description: "The error code."
        errorDetail:
          type: string
          description: "A human-readable error message."
      required:
        - type
        - errorCode

    StatusMessage:
      type: object
      title: "Final message with the status of PoPP-Token generation"
      description: |
        Sent by the server to inform the PoPP-Module of the status for
        PoPP-Token generation.
      properties:
        name:
          type: string
          const: "Status"
          description: "The constant type identifier for Status."
        state:
          description: The status of PoPP-Token generation
          type: string
          enum:
            - pending
            - success
            - canceled
        id:
          description: The ID of PoPP data record
          type: string
          examples: [237cc7b7-f85e-42c3-981c-ad7f9d97ddca]
      required:
        - name
        - state
        - id

  securitySchemes:
    oauth2Profiles:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/auth
          tokenUrl: https://auth.example.com/token
          scopes:
            checkin:ehc: Check-in with eHealth-Card.
